[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: every path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and the seed data must never be served stale,
# or a deploy won't reach devices that already have the app installed.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
